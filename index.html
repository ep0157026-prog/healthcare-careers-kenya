<title>Healthcare Careers Kenya</title>

:root{
  --primary:#0b5ed7;
  --dark:#123;
  --light:#f5f7fa;
  --border:#ddd;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:#222;
}

header{
  background:var(--primary);
  color:white;
  padding:30px 20px;
  text-align:center;
}

header h1{
  margin:0 0 10px;
  font-size:32px;
}

header p{
  margin:0;
  font-size:16px;
}

.container{

.actions{
  text-align:center;
  margin-bottom:25px;
}

.post-vacancy{
  display:inline-block;
  padding:13px 24px;
  background:#198754;
  color:white;
  text-decoration:none;
  border-radius:7px;
  font-weight:bold;
}

.post-vacancy:hover{
  opacity:.9;
}

.filters{
  background:white;
  padding:18px;
  border-radius:10px;

  margin-bottom:20px;
}

.filters input,
.filters select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:15px;
}

.job{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.job h3{

  color:var(--primary);
}

.job p{

}

.description{

  line-height:1.6;
  white-space:pre-line;

.details{

}

.details-btn,
.apply{

  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
  border:none;
  cursor:pointer;
  font-size:14px;
}

.details-btn{
  background:#6c757d;
}

.apply{
  background:var(--primary);
}

.details-btn:hover,
.apply:hover{
  opacity:.9;
}
