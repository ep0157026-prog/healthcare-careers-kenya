<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Healthcare Careers Kenya</title>

<meta name="description" content="Healthcare jobs, internships, attachments and locum opportunities in Kenya.">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#222;
}

header{
  background:#0b5ed7;
  color:white;
  text-align:center;
  padding:30px 15px;
}

header h1{
  margin:0 0 10px;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.actions{
  text-align:center;
  margin-bottom:20px;
}

.post-vacancy{
  display:inline-block;
  background:#198754;
  color:white;
  padding:13px 22px;
  border-radius:7px;
  text-decoration:none;
  font-weight:bold;
}

.filters{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

.filters input,
.filters select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:6px;
  box-sizing:border-box;
}

.job{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.job h3{
  color:#0b5ed7;
}

.job p{
  line-height:1.5;
}

button,
.apply{
  display:inline-block;
  padding:10px 16px;
  margin-top:8px;
  margin-right:6px;
  border:0;
  border-radius:6px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

button{
  background:#6c757d;
}

.apply{
  background:#0b5ed7;
}

.description{
  display:none;
  border-top:1px solid #ddd;
  margin-top:15px;
  padding-top:15px;
  white-space:pre-line;
}

footer{
  margin-top:40px;
  padding:25px;
  text-align:center;
  background:#123;
  color:white;
}
</style>
</head>

<body>

<header>
<h1>Healthcare Careers Kenya</h1>
<p>Jobs, internships, attachments, locum opportunities and more.</p>
</header>

<div class="container">

<div class="actions">
<a
class="post-vacancy"
href="https://docs.google.com/forms/d/e/1FAIpQLSfFn-fwpytlIsKYqZRoDTt5scl4zy-LJfSMhZXvUPQmws6DZg/viewform?usp=sharing&ouid=115243584880251400944"
target="_blank">
Post a Vacancy
</a>
</div>

<div class="filters">

<input
id="searchInput"
type="text"
placeholder="Search jobs by title, employer or location">

<select id="typeFilter">
<option value="all">All Opportunities</option>
<option value="Job">Jobs</option>
<option value="Internship">Internships</option>
<option value="Attachment">Attachments</option>
<option value="Locum">Locum</option>
<option value="Volunteer">Volunteer</option>
<option value="Training">Training</option>
<option value="Other">Other</option>
</select>

</div>

<div id="jobList">
<p>Loading opportunities...</p>
</div>

</div>

<footer>
© 2026 Healthcare Careers Kenya
</footer>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwbRSWd5A5osXD0QDZKN-EU0p230WGYqdZTWLwYEbl1wyT3CoHVLV231B9c3vNd6yhw/exec";

const jobList =
document.getElementById("jobList");

const searchInput =
document.getElementById("searchInput");

const typeFilter =
document.getElementById("typeFilter");

let jobs=[];

function displayJobs(){

const search =
searchInput.value.toLowerCase().trim();

const selectedType =
typeFilter.value;

jobList.innerHTML="";

const filteredJobs=jobs.filter(job=>{

const values=Object.values(job);

const title=String(values[0]||"");
const employer=String(values[1]||"");
const location=String(values[2]||"");
const category=String(values[3]||"");

const searchable=
(title+" "+employer+" "+location)
.toLowerCase();

return searchable.includes(search) &&
(
selectedType==="all" ||
category.toLowerCase()===
selectedType.toLowerCase()
);

});

if(filteredJobs.length===0){

jobList.innerHTML=
"<p>No opportunities found.</p>";

return;
}

filteredJobs.forEach((job,index)=>{

const values=Object.values(job);

const title=values[0]||"Untitled Opportunity";
const employer=values[1]||"Not specified";
const location=values[2]||"Kenya";
const category=values[3]||"Opportunity";
const deadline=values[4]||"Not specified";
const applyLink=values[5]||"";
const description=values[6]||"No description provided.";

const card=document.createElement("div");

card.className="job";

card.innerHTML=`

<h3>${title}</h3>

<p><strong>Employer:</strong> ${employer}</p>

<p><strong>Location:</strong> ${location}</p>

<p><strong>Category:</strong> ${category}</p>

<p><strong>Deadline:</strong> ${deadline}</p>

<button onclick="toggleDescription(${index})">
View Details
</button>

${
applyLink
?
`<a class="apply"
href="${applyLink}"
target="_blank">
Apply Now
</a>`
:
""
}

<div
id="description-${index}"
class="description">

<strong>Opportunity Details</strong>

<p>${description}</p>

</div>

`;

jobList.appendChild(card);

});

}

function toggleDescription(index){

const box=
document.getElementById(
"description-"+index
);

if(box.style.display==="block"){

box.style.display="none";

}else{

box.style.display="block";

}

}

fetch(API_URL)

.then(response=>response.json())

.then(data=>{

jobs=data;

displayJobs();

})

.catch(error=>{

console.error(error);

jobList.innerHTML=
"<p>Unable to load opportunities.</p>";

});

searchInput.addEventListener(
"input",
displayJobs
);

typeFilter.addEventListener(
"change",
displayJobs
);

</script>

</body>
</html>
