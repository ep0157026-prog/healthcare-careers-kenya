<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Healthcare Careers Kenya — jobs, internships, attachments, locum opportunities and professional opportunities for healthcare workers.">

<title>Healthcare Careers Kenya</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #222;
}

header {
  background: #0b5ed7;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
}

header p {
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

.search-area {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 25px;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

.job {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.job h3 {
  margin-top: 0;
}

.tag {
  display: inline-block;
  padding: 5px 10px;
  background: #e8f1ff;
  border-radius: 20px;
  font-size: 13px;
  margin-top: 5px;
}

.apply {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 15px;
  background: #198754;
  color: white;
  text-decoration: none;
  border-radius: 6px;
}

footer {
  text-align: center;
  padding: 30px 15px;
  margin-top: 40px;
  background: #222;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>Healthcare Careers Kenya</h1>
  <p>Jobs, internships, attachments and locum opportunities for healthcare professionals</p>
</header>

<div class="container">

  <div class="search-area">
    <label for="searchInput"><strong>Search opportunities</strong></label>
    <input
      type="text"
      id="searchInput"
      placeholder="Search job title, employer, location..."
    >

    <label for="typeFilter"><strong>Opportunity type</strong></label>
    <select id="typeFilter">
      <option value="all">All Opportunities</option>
      <option value="Job">Jobs</option>
      <option value="Internship">Internships</option>
      <option value="Attachment">Attachments</option>
      <option value="Locum">Locum</option>
    </select>
  </div>

  <h2>Latest Opportunities</h2>

  <div id="jobList"></div>

  <p id="noResults" style="display:none;">
    No opportunities found.
  </p>

</div>

<footer>
  <p>© 2026 Healthcare Careers Kenya</p>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwbRSWd5A5osXD0DQZKN-EU0p230WGYqdZTWLwYEbl1wyT3CoHVLV231B9c3vNd6yhw/exec";

const searchInput = document.getElementById("searchInput");
const typeFilter = document.getElementById("typeFilter");
const jobList = document.getElementById("jobList");
const noResults = document.getElementById("noResults");

fetch(API_URL)
  .then(response => response.json())
  .then(data => {

    console.log("DATA FROM SHEET:", data);

    jobList.innerHTML = "";

    data.forEach(job => {

      if (!job["Job Title"]) return;

      const card = document.createElement("div");
      card.className = "job";

      card.innerHTML = `
        <h3>${job["Job Title"]}</h3>
        <p><strong>Employer:</strong> ${job["Employer"] || ""}</p>
        <p><strong>Location:</strong> ${job["Location"] || ""}</p>
        <p><strong>Category:</strong> ${job["Category"] || ""}</p>
        <p><strong>Deadline:</strong> ${job["Deadline"] || ""}</p>
        ${
          job["Apply Link"]
            ? `<a href="${job["Apply Link"]}" target="_blank" class="apply">Apply Now</a>`
            : ""
        }
      `;

      jobList.appendChild(card);
    });

  })
  .catch(error => {
    console.error("FAILED:", error);
    noResults.textContent = "Unable to load opportunities.";
    noResults.style.display = "block";
  });
</script>
