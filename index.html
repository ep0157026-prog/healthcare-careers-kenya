<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Healthcare Careers Kenya — jobs, internships, attachments, locum opportunities and professional opportunities for healthcare workers.">

<title>Healthcare Careers Kenya</title>

<style>

:root{
  --primary:#0b5ed7;
  --dark:#123;
  --light:#f5f7fa;
  --border:#ddd;
  --green:#198754;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:#222;
}

header{
  background:var(--primary);
  color:white;
  padding:30px 20px;
  text-align:center;
}

header h1{
  margin:0 0 10px;
  font-size:32px;
}

header p{
  margin:0;
  font-size:16px;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.actions{
  text-align:center;
  margin-bottom:25px;
}

.post-vacancy{
  display:inline-block;
  padding:13px 24px;
  background:var(--green);
  color:white;
  text-decoration:none;
  border-radius:7px;
  font-weight:bold;
}

.post-vacancy:hover{
  opacity:.9;
}

.filters{
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.filters input,
.filters select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:15px;
}

.filters select{
  margin-bottom:0;
}

.job{
  background:white;
  padding:22px;
  margin-bottom:18px;
  border-radius:12px;
  border:1px solid #e5e7eb;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  transition:transform .2s,box-shadow .2s;
}

.job:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(0,0,0,.12);
}

.job h3{
  margin-top:0;
  margin-bottom:15px;
  color:var(--primary);
  font-size:21px;
}

.job p{
  margin:9px 0;
  line-height:1.5;
  color:#444;
}

.job p strong{
  color:#123;
}

.buttons{
  margin-top:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.apply,
.details-button{
  display:inline-block;
  padding:10px 18px;
  color:white;
  text-decoration:none;
  border-radius:6px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.apply{
  background:var(--primary);
}

.details-button{
  background:#555;
}

.apply:hover,
.details-button:hover{
  opacity:.9;
}

.full-description{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#f8f9fa;
  border-left:4px solid var(--primary);
  border-radius:5px;
  line-height:1.6;
  white-space:pre-line;
}

.full-description.show{
  display:block;
}

footer{
  text-align:center;
  padding:25px;
  margin-top:40px;
  background:var(--dark);
  color:white;
  font-size:14px;
}

@media(max-width:600px){

  header h1{
    font-size:25px;
  }

  header p{
    font-size:14px;
    line-height:1.5;
  }

  .container{
    padding:0 12px;
  }

  .job{
    padding:17px;
  }

  .job h3{
    font-size:19px;
  }

  .buttons{
    flex-direction:column;
  }

  .apply,
  .details-button{
    width:100%;
    text-align:center;
  }

}

</style>
</head>

<body>

<header>

<h1>Healthcare Careers Kenya</h1>

<p>
Jobs, internships, attachments, locum opportunities and more for healthcare professionals.
</p>

</header>

<div class="container">

<div class="actions">

<a
  href="https://docs.google.com/forms/d/e/1FAIpQLSfFn-fwpytlIsKYqZRoDTt5scl4zy-LJfSMhZXvUPQmws6DZg/viewform?usp=sharing&ouid=115243584880251400944"
  target="_blank"
  rel="noopener"
  class="post-vacancy"
>
  Post a Vacancy
</a>

</div>

<div class="filters">

<input
  type="text"
  id="searchInput"
  placeholder="Search jobs, employers or locations..."
>

<select id="typeFilter">

<option value="all">All Opportunities</option>
<option value="job">Jobs</option>
<option value="internship">Internships</option>
<option value="attachment">Attachments</option>
<option value="locum">Locum</option>
<option value="volunteer">Volunteer</option>
<option value="training">Training</option>
<option value="other">Other</option>

</select>

</div>

<div id="jobList">

<p>Loading opportunities...</p>

</div>

</div>

<footer>

Healthcare Careers Kenya

<br><br>

Connecting healthcare professionals with opportunities across Kenya.

</footer>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyNd6DKiOeiW6zgvqzE3Ln64ElA1Tgs5QjC12Fg8CUvXKr4w9YIUd1wffR-GPH-6hQA/exec";
const searchInput =
document.getElementById("searchInput");

const typeFilter =
document.getElementById("typeFilter");

const jobList =
document.getElementById("jobList");

let jobs = [];

function displayJobs(){

  const search =
    searchInput.value.toLowerCase().trim();

  const selectedType =
    typeFilter.value.toLowerCase().trim();

  jobList.innerHTML = "";

  const filteredJobs = jobs.filter(job => {

    const values = Object.values(job);

    const title =
      String(values[0] || "");

    const employer =
      String(values[1] || "");

    const location =
      String(values[2] || "");

    const category =
      String(values[3] || "");

    const searchableText =
      (
        title + " " +
        employer + " " +
        location
      ).toLowerCase();

    const matchesSearch =
      searchableText.includes(search);

    const matchesCategory =
      selectedType === "all" ||
      category.toLowerCase().trim() === selectedType;

    return matchesSearch && matchesCategory;

  });

  if(filteredJobs.length === 0){

    jobList.innerHTML =
      "<p>No opportunities found.</p>";

    return;

  }

  filteredJobs.forEach((job,index) => {

    const values =
      Object.values(job);

    const title =
      values[0] || "Untitled Opportunity";

    const employer =
      values[1] || "Not specified";

    const location =
      values[2] || "Kenya";

    const category =
      values[3] || "Opportunity";

    const deadline =
      values[4] || "Not specified";

    const applyLink =
      values[5] || "";

    const description =
      values[6] ||
      "No additional details have been provided.";

    const card =
      document.createElement("div");

    card.className = "job";

    const descriptionId =
      "description-" + index;

    card.innerHTML = `

      <h3>
        ${escapeHTML(title)}
      </h3>

      <p>
        <strong>Employer:</strong>
        ${escapeHTML(employer)}
      </p>

      <p>
        <strong>Location:</strong>
        ${escapeHTML(location)}
      </p>

      <p>
        <strong>Category:</strong>
        ${escapeHTML(category)}
      </p>

      <p>
        <strong>Deadline:</strong>
        ${formatDate(deadline)}
      </p>

      <div class="buttons">

        ${
          applyLink
          ?
          `
          <a
            href="${escapeAttribute(applyLink)}"
            target="_blank"
            rel="noopener"
            class="apply">
            Apply Now
          </a>
          `
          :
          ""
        }

        <button
          type="button"
          class="details-button"
          onclick="toggleDescription('${descriptionId}', this)">
          View Details
        </button>

      </div>

      <div
        id="${descriptionId}"
        class="full-description">

        <strong>Opportunity Details</strong>

        <br><br>

        ${escapeHTML(description)}

      </div>

    `;

    jobList.appendChild(card);

  });

}

function toggleDescription(id,button){

  const description =
    document.getElementById(id);

  if(description.classList.contains("show")){

    description.classList.remove("show");

    button.textContent =
      "View Details";

  }else{

    description.classList.add("show");

    button.textContent =
      "Hide Details";

  }

}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttribute(value){

  return String(value)
    .replace(/"/g,"%22")
    .replace(/'/g,"%27")
    .trim();

}

function formatDate(value){

  if(!value){
    return "Not specified";
  }

  const date =
    new Date(value);

  if(!isNaN(date.getTime())){

    return date.toLocaleDateString(
      "en-GB",
      {
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );

  }

  return escapeHTML(value);

}

fetch(API_URL)

  .then(response => {

    if(!response.ok){
      throw new Error("API request failed");
    }

    return response.json();

  })

  .then(data => {

    jobs = Array.isArray(data)
      ? data
      : [];

    displayJobs();

  })

  .catch(error => {

    console.error(
      "Error loading jobs:",
      error
    );

    jobList.innerHTML =
      "<p>Unable to load opportunities.</p>";

  });

searchInput.addEventListener(
  "input",
  displayJobs
);

typeFilter.addEventListener(
  "change",
  displayJobs
);

</script>

</body>
</html>
