<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description"
content="Healthcare Careers Kenya — jobs, internships, attachments, locum opportunities and professional opportunities for healthcare workers.">

<title>Healthcare Careers Kenya</title>

<style>

:root{
  --primary:#0b5ed7;
  --dark:#123;
  --light:#f5f7fa;
  --border:#ddd;
  --green:#198754;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:#222;
}

/* HEADER */

header{
  background:var(--primary);
  color:white;
  padding:30px 20px;
  text-align:center;
}

header h1{
  margin:0 0 10px;
  font-size:32px;
}

header p{
  margin:0;
  font-size:16px;
}

/* MAIN CONTAINER */

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

/* POST VACANCY */

.actions{
  text-align:center;
  margin-bottom:25px;
}

.post-vacancy{
  display:inline-block;
  padding:13px 24px;
  background:var(--green);
  color:white;
  text-decoration:none;
  border-radius:7px;
  font-weight:bold;
}

.post-vacancy:hover{
  opacity:.9;
}

/* FILTERS */

.filters{
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.filters input,
.filters select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:15px;
}

.filters select{
  margin-bottom:0;
}

/* JOB CARD */

.job{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.job h3{
  margin-top:0;
  margin-bottom:15px;
  color:var(--primary);
  font-size:21px;
}

.job p{
  margin:8px 0;
  line-height:1.5;
}

/* BUTTONS */

.buttons{
  margin-top:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.apply,
.details-button{
  display:inline-block;
  padding:10px 18px;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
  border:none;
  cursor:pointer;
  font-size:14px;
}

.apply{
  background:var(--primary);
}

.details-button{
  background:#555;
}

.apply:hover,
.details-button:hover{
  opacity:.9;
}

/* DESCRIPTION */

.full-description{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#f8f9fa;
  border-left:4px solid var(--primary);
  border-radius:5px;
  line-height:1.6;
  white-space:pre-line;
}

.full-description.show{
  display:block;
}

/* FOOTER */

footer{
  text-align:center;
  padding:25px;
  margin-top:40px;
  background:var(--dark);
  color:white;
  font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

  header h1{
    font-size:25px;
  }

  header p{
    font-size:14px;
    line-height:1.5;
  }

  .container{
    padding:0 12px;
  }

  .job{
    padding:17px;
  }

  .job h3{
    font-size:19px;
  }

  .buttons{
    flex-direction:column;
  }

  .apply,
  .details-button{
    width:100%;
    text-align:center;
  }

}

</style>
</head>

<body>

<header>

  <h1>Healthcare Careers Kenya</h1>

  <p>
    Jobs, internships, attachments, locum opportunities and more
    for healthcare professionals.
  </p>

</header>

<div class="container">

  <!-- POST A VACANCY -->

  <div class="actions">

    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSfFn-fwpytlIsKYqZRoDTt5scl4zy-LJfSMhZXvUPQmws6DZg/viewform?usp=sharing&ouid=115243584880251400944"
      target="_blank"
      rel="noopener"
      class="post-vacancy">

      Post a Vacancy

    </a>

  </div>


  <!-- SEARCH AND FILTER -->

  <div class="filters">

    <input
      type="text"
      id="searchInput"
      placeholder="Search jobs by title, employer or location">

    <select id="typeFilter">

      <option value="all">
        All Opportunities
      </option>

      <option value="Job">
        Jobs
      </option>

      <option value="Internship">
        Internships
      </option>

      <option value="Attachment">
        Attachments
      </option>

      <option value="Locum">
        Locum
      </option>

      <option value="Volunteer">
        Volunteer
      </option>

      <option value="Training">
        Training
      </option>

      <option value="Other">
        Other
      </option>

    </select>

  </div>


  <!-- JOBS -->

  <div id="jobList">

    <p>
      Loading opportunities...
    </p>

  </div>

</div>


<footer>

  <p>
    © 2026 Healthcare Careers Kenya
  </p>
</footer>
