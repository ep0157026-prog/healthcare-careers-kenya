<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Healthcare Careers Kenya — jobs, internships, attachments, locum opportunities and professional opportunities for healthcare workers.">
<title>Healthcare Careers Kenya</title>

<style>
:root{
  --primary:#0b5ed7;
  --dark:#123;
  --light:#f5f7fa;
  --border:#ddd;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:#222;
}

header{
  background:var(--primary);
  color:white;
  padding:30px 20px;
  text-align:center;
}

header h1{
  margin:0 0 10px;
  font-size:32px;
}

header p{
  margin:0;
  font-size:16px;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.actions{
  text-align:center;
  margin-bottom:25px;
}

.post-vacancy{
  display:inline-block;
  padding:13px 24px;
  background:#198754;
  color:white;
  text-decoration:none;
  border-radius:7px;
  font-weight:bold;
}

.post-vacancy:hover{
  opacity:.9;
}

.filters{
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.filters input,
.filters select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:15px;
}

.job{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.job h3{
  margin-top:0;
  color:var(--primary);
}

.job p{
  margin:8px 0;
}

.apply{
  display:inline-block;
  margin-top:10px;
  padding:10px 18px;
  background:var(--primary);
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

.apply:hover{
  opacity:.9;
}

footer{
  text-align:center;
  padding:25px;
  margin-top:40px;
  background:#123;
  color:white;
  font-size:14px;
}

@media(max-width:600px){
  header h1{
    font-size:25px;
  }

  .container{
    padding:0 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Healthcare Careers Kenya</h1>
  <p>Jobs, internships, attachments, locum opportunities and more for healthcare professionals.</p>
</header>

<div class="container">

  <div class="actions">
    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSfFn-fwpytlIsKYqZRoDTt5scl4zy-LJfSMhZXvUPQmws6DZg/viewform?usp=sharing&ouid=115243584880251400944"
      target="_blank"
      class="post-vacancy">
      Post a Vacancy
    </a>
  </div>

  <div class="filters">
    <input
      type="text"
      id="searchInput"
      placeholder="Search jobs by title, employer or location">

    <select id="typeFilter">
      <option value="all">All Opportunities</option>
      <option value="Job">Jobs</option>
      <option value="Internship">Internships</option>
      <option value="Attachment">Attachments</option>
      <option value="Locum">Locum</option>
      <option value="Volunteer">Volunteer</option>
      <option value="Training">Training</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div id="jobList">
    <p>Loading opportunities...</p>
  </div>

</div>

<footer>
  <p>© 2026 Healthcare Careers Kenya</p>
</footer>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwbRSWd5A5osXD0QDZKN-EU0p230WGYqdZTWLwYEbl1wyT3CoHVLV231B9c3vNd6yhw/exec";

const jobList = document.getElementById("jobList");
const searchInput = document.getElementById("searchInput");
const typeFilter = document.getElementById("typeFilter");

let jobs = [];

function displayJobs(){

  const search =
    searchInput.value.toLowerCase().trim();

  const selectedType =
    typeFilter.value;

  jobList.innerHTML = "";

  const filteredJobs = jobs.filter(job => {

    const values = Object.values(job);

    const title =
      String(values[0] || "");

    const employer =
      String(values[1] || "");

    const location =
      String(values[2] || "");

    const category =
      String(values[3] || "");

    const searchableText =
      (
        title + " " +
        employer + " " +
        location
      ).toLowerCase();

    const matchesSearch =
      searchableText.includes(search);

    const matchesCategory =
      selectedType === "all" ||
      category.trim().toLowerCase() ===
      selectedType.trim().toLowerCase();

    return matchesSearch && matchesCategory;

  });

  if(filteredJobs.length === 0){

    jobList.innerHTML =
      "<p>No opportunities found.</p>";

    return;
  }

  filteredJobs.forEach(job => {

    const values =
      Object.values(job);

    const title =
      values[0] || "Untitled Opportunity";

    const employer =
      values[1] || "Not specified";

    const location =
      values[2] || "Kenya";

    const category =
      values[3] || "Opportunity";

    const deadline =
      values[4] || "Not specified";

    const applyLink =
      values[5] || "";

    const card =
      document.createElement("div");

    card.className = "job";

    card.innerHTML = `
      <h3>${title}</h3>

      <p>
        <strong>Employer:</strong>
        ${employer}
      </p>

      <p>
        <strong>Location:</strong>
        ${location}
      </p>

      <p>
        <strong>Category:</strong>
        ${category}
      </p>

      <p>
        <strong>Deadline:</strong>
        ${deadline}
      </p>

      ${
        applyLink
        ?
        `
        <a
          href="${applyLink}"
          target="_blank"
          rel="noopener"
          class="apply">
          Apply Now
        </a>
        `
        :
        ""
      }
    `;

    jobList.appendChild(card);

  });

}

fetch(API_URL)

  .then(response => response.json())

  .then(data => {

    jobs = data;

    displayJobs();

  })

  .catch(error => {

    console.error(
      "Error loading jobs:",
      error
    );

    jobList.innerHTML =
      "<p>Unable to load opportunities.</p>";

  });

searchInput.addEventListener(
  "input",
  displayJobs
);

typeFilter.addEventListener(
  "change",
  displayJobs
);

</script>

</body>
</html>
